# Despliegue del frontend (web/) en Netlify. El backend se despliega aparte.
[build]
  base    = "web"
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "24"
  # La web lee los datos de la API desde el navegador.
  NEXT_PUBLIC_API_URL = "https://api.hearteats.org"

# Idioma: la raíz (/) lleva a /en si el navegador está en inglés. En cualquier
# otro caso, la página raíz redirige al idioma por defecto (es).
[[redirects]]
  from       = "/"
  to         = "/en"
  status     = 302
  force      = true
  conditions = { Language = ["en"] }

# Los locales se leen de la API en el navegador, no se generan al compilar: las
# fichas (y sus formularios) comparten una sola página, la del slug «_», y
# estas reescrituras (código 200, la dirección no cambia) la sirven para
# cualquier slug. Solo actúan si no existe ya un archivo con esa ruta.
# Mantener sincronizado con web/serve.json, que usan las pruebas.
[[redirects]]
  from   = "/:locale/place/:slug"
  to     = "/:locale/place/_.html"
  status = 200

[[redirects]]
  from   = "/:locale/correct/:slug"
  to     = "/:locale/correct/_.html"
  status = 200

[[redirects]]
  from   = "/:locale/business/:slug"
  to     = "/:locale/business/_.html"
  status = 200

# Las demás rutas se generan como HTML estático en el build; las inexistentes
# sirven out/404.html.

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    # Cerrado a buscadores hasta el lanzamiento (junto a robots.txt y la
    # etiqueta robots de app/[locale]/layout.tsx). Quitar los tres a la vez.
    X-Robots-Tag = "noindex, nofollow"
