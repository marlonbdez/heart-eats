# Despliegue del frontend (web/) en Netlify. El backend se despliega aparte.
[build]
  base    = "web"
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "24"
  # La web lee los datos de la API desde el navegador. Por defecto, la de
  # producción; staging y las vistas previas la cambian justo debajo.
  NEXT_PUBLIC_API_URL = "https://api.hearteats.org"

# Entornos (docs/14_PRODUCCION.md, «Staging y producción»): la rama «main» es
# producción y se despliega con el contexto «production». «staging» y las
# demás ramas con despliegue propio usan «branch-deploy». Las vistas previas de
# las PR también leen de staging, nunca de la base real.
[context.branch-deploy.environment]
  NEXT_PUBLIC_API_URL = "https://api-staging.hearteats.org"

[context.deploy-preview.environment]
  NEXT_PUBLIC_API_URL = "https://api-staging.hearteats.org"

# Idioma: la raíz (/) la resuelve la propia página en el navegador (el idioma
# que la persona eligió, si no el del navegador, si no inglés), porque la
# elección guardada solo se conoce allí.

# Los locales se leen de la API en el navegador, no se generan al compilar: las
# fichas (y sus formularios) comparten una sola página, la del slug «_», y
# estas reescrituras (código 200, la dirección no cambia) la sirven para
# cualquier slug. Solo actúan si no existe ya un archivo con esa ruta.
# Mantener sincronizado con web/serve.json, que usan las pruebas.
[[redirects]]
  from   = "/:locale/place/:slug"
  to     = "/:locale/place/_.html"
  status = 200

[[redirects]]
  from   = "/:locale/correct/:slug"
  to     = "/:locale/correct/_.html"
  status = 200

[[redirects]]
  from   = "/:locale/business/:slug"
  to     = "/:locale/business/_.html"
  status = 200

# Las demás rutas se generan como HTML estático en el build; las inexistentes
# sirven out/404.html.

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    # Cerrado a buscadores hasta el lanzamiento (junto a robots.txt y la
    # etiqueta robots de app/[locale]/layout.tsx). Quitar los tres a la vez.
    X-Robots-Tag = "noindex, nofollow"
